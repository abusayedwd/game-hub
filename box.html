<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Dodge | Advanced Space Shooter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      user-select: none;
      touch-action: none;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 20px;
      position: relative;
    }

    .header h1 {
      font-size: 2.8rem;
      margin: 20px 0;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .stats-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px 25px;
      min-width: 120px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 5px;
      background: linear-gradient(45deg, #ffd700, #ffa500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #game {
      width: 90vw;
      max-width: 500px;
      height: 70vh;
      max-height: 650px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(78, 205, 196, 0.5);
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(78, 205, 196, 0.3);
      backdrop-filter: blur(5px);
    }

    #player {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      box-shadow: 0 0 25px #4ecdc4;
      z-index: 10;
      transition: transform 0.2s ease;
    }

    #player::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 30px;
      background: linear-gradient(to top, transparent, #4ecdc4);
      border-radius: 50% 50% 0 0;
      animation: enginePulse 1s infinite;
    }

    @keyframes enginePulse {
      0%, 100% { opacity: 0.7; height: 25px; }
      50% { opacity: 1; height: 35px; }
    }

    .enemy {
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #ff6b6b, #ff4757);
      position: absolute;
      top: -60px;
      border-radius: 50%;
      box-shadow: 0 0 20px #ff6b6b;
      animation: enemyGlow 2s infinite alternate;
    }

    @keyframes enemyGlow {
      0% { box-shadow: 0 0 15px #ff6b6b; }
      100% { box-shadow: 0 0 25px #ff4757; }
    }

    .bonus {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ffd700, #ffa500);
      position: absolute;
      top: -60px;
      border-radius: 50%;
      box-shadow: 0 0 25px #ffd700;
      animation: bonusSpin 2s linear infinite, bonusGlow 1.5s infinite alternate;
      z-index: 5;
    }

    @keyframes bonusSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bonusGlow {
      0% { box-shadow: 0 0 20px #ffd700; }
      100% { box-shadow: 0 0 35px #ffa500; }
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(10px);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .game-over-content {
      text-align: center;
      padding: 30px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    #overlay h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ff6b6b, #ff4757);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
    }

    .final-score {
      font-size: 1.8rem;
      margin: 15px 0;
      color: #4ecdc4;
    }

    .high-score {
      font-size: 1.4rem;
      margin: 10px 0;
      color: #ffd700;
    }

    .btn {
      padding: 15px 40px;
      background: linear-gradient(45deg, #4ecdc4, #44a08d);
      border: none;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      color: white;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(78, 205, 196, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .instructions {
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 15px;
      border-radius: 20px;
    }

    .pulse {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .stat-card {
        padding: 10px 15px;
        min-width: 100px;
      }
      
      .stat-value {
        font-size: 1.5rem;
      }
      
      .btn {
        padding: 12px 30px;
        font-size: 1rem;
      }
     button {
    margin-top: 15px;
    padding: 15px 40px;
    border-radius: 12px;
    border: 2px solid var(--accent-purple);
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    font-size: 18px;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
    transition: all 0.3s ease;
  }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
   <button onclick="goHome()">🏠 Back</button>
      <h1><i class="fas fa-space-shuttle"></i> GALACTIC DODGE</h1>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div id="score" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Score</div>
        <div id="high" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Bonus Collected</div>
        <div id="bonus-count" class="stat-value">0</div>
      </div>
    </div>

    <div id="game">
      <div id="player"></div>
      <div id="overlay">
        <div class="game-over-content">
          <h2>MISSION FAILED</h2>
          <div class="final-score">Final Score: <span id="final-score">0</span></div>
          <div class="high-score">High Score: <span id="final-high">0</span></div>
          <button id="restart-btn" class="btn">Launch Again</button>
        </div>
      </div>
    </div>

    <div class="instructions">
      <p>Dodge the red asteroids and collect golden bonus stars!</p>
      <div class="controls">
        <div class="control-item"><i class="fas fa-arrow-left"></i> <i class="fas fa-arrow-right"></i> Move</div>
        <div class="control-item">🖱️ Mouse / 👆 Touch</div>
      </div>
    </div>
  </div>

  <script>
      function goHome() {
    window.location.href = "index.html";
  }
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");
    const bonusCountEl = document.getElementById("bonus-count");
    const overlay = document.getElementById("overlay");
    const finalScoreEl = document.getElementById("final-score");
    const finalHighEl = document.getElementById("final-high");
    const restartBtn = document.getElementById("restart-btn");

    let gameWidth, playerX;
    let enemies = [];
    let bonuses = [];
    let score = 0;
    let bonusCount = 0;
    let speed = 3;
    let running = false;
    let highScore = localStorage.getItem("galactic_high") || 0;
    let bonusSpawnRate = 0.01;

    highEl.innerText = highScore;

    function updateSizes() {
      gameWidth = game.clientWidth;
    }
    window.addEventListener("resize", updateSizes);
    updateSizes();

    // KEYBOARD CONTROL
    document.addEventListener("keydown", e => {
      if (!running) return;
      if (e.key === "ArrowLeft") movePlayer(-40);
      if (e.key === "ArrowRight") movePlayer(40);
    });

    // MOUSE CONTROL
    game.addEventListener("mousemove", e => {
      if (!running) return;
      const rect = game.getBoundingClientRect();
      playerX = e.clientX - rect.left - 30;
      clampPlayer();
    });

    // TOUCH CONTROL
    game.addEventListener("touchmove", e => {
      if (!running) return;
      e.preventDefault();
      const rect = game.getBoundingClientRect();
      playerX = e.touches[0].clientX - rect.left - 30;
      clampPlayer();
    });

    function movePlayer(dx) {
      playerX += dx;
      clampPlayer();
      player.style.transform = `translateX(-50%) scale(${1 + Math.abs(dx)/100})`;
      setTimeout(() => {
        player.style.transform = 'translateX(-50%)';
      }, 100);
    }

    function clampPlayer() {
      playerX = Math.max(0, Math.min(gameWidth - 60, playerX));
      player.style.left = playerX + "px";
    }

    function createEnemy() {
      const enemy = document.createElement("div");
      enemy.className = "enemy";
      enemy.style.left = Math.random() * (gameWidth - 55) + "px";
      enemy.style.top = "-60px";
      game.appendChild(enemy);
      enemies.push(enemy);
    }

    function createBonus() {
      const bonus = document.createElement("div");
      bonus.className = "bonus";
      bonus.style.left = Math.random() * (gameWidth - 50) + "px";
      bonus.style.top = "-60px";
      game.appendChild(bonus);
      bonuses.push(bonus);
    }

    function collision(a, b) {
      const r1 = a.getBoundingClientRect();
      const r2 = b.getBoundingClientRect();
      return !(
        r1.bottom < r2.top ||
        r1.top > r2.bottom ||
        r1.right < r2.left ||
        r1.left > r2.right
      );
    }

    function createParticle(x, y, color) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.backgroundColor = color;
      game.appendChild(particle);
      
      let angle = Math.random() * Math.PI * 2;
      let speed = 2 + Math.random() * 3;
      let life = 30;
      
      const animate = () => {
        if (life <= 0) {
          particle.remove();
          return;
        }
        particle.style.left = (parseFloat(particle.style.left) + Math.cos(angle) * speed) + 'px';
        particle.style.top = (parseFloat(particle.style.top) + Math.sin(angle) * speed) + 'px';
        particle.style.opacity = life / 30;
        life--;
        requestAnimationFrame(animate);
      };
      animate();
    }

    function gameLoop() {
      if (!running) return;

      // Update enemies
      enemies.forEach((enemy, i) => {
        const currentTop = parseFloat(enemy.style.top);
        enemy.style.top = (currentTop + speed) + "px";

        if (collision(player, enemy)) {
          endGame();
          return;
        }

        if (currentTop > game.clientHeight) {
          enemy.remove();
          enemies.splice(i, 1);
          score++;
          scoreEl.innerText = score;
          
          // Create particles on enemy exit
          for (let j = 0; j < 5; j++) {
            createParticle(
              parseFloat(enemy.style.left) + 27,
              game.clientHeight,
              '#ff6b6b'
            );
          }
        }
      });

      // Update bonuses
      bonuses.forEach((bonus, i) => {
        const currentTop = parseFloat(bonus.style.top);
        bonus.style.top = (currentTop + speed * 0.8) + "px";

        if (collision(player, bonus)) {
          bonus.remove();
          bonuses.splice(i, 1);
          bonusCount++;
          bonusCountEl.innerText = bonusCount;
          score += 10;
          scoreEl.innerText = score;
          
          // Create golden particles
          for (let j = 0; j < 8; j++) {
            createParticle(
              parseFloat(bonus.style.left) + 25,
              parseFloat(bonus.style.top) + 25,
              '#ffd700'
            );
          }
        }

        if (currentTop > game.clientHeight) {
          bonus.remove();
          bonuses.splice(i, 1);
        }
      });

      // Spawn enemies and bonuses
      if (Math.random() < 0.035) createEnemy();
      if (Math.random() < bonusSpawnRate) createBonus();
      
      // Gradually increase difficulty
      speed += 0.002;
      bonusSpawnRate = Math.min(0.02, bonusSpawnRate + 0.00001);

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      enemies.forEach(e => e.remove());
      bonuses.forEach(b => b.remove());
      enemies = [];
      bonuses = [];
      score = 0;
      bonusCount = 0;
      speed = 3;
      bonusSpawnRate = 0.01;
      playerX = gameWidth / 2 - 30;
      scoreEl.innerText = "0";
      bonusCountEl.innerText = "0";
      overlay.classList.remove('active');
      running = true;
      gameLoop();
    }

    function endGame() {
      running = false;
      finalScoreEl.innerText = score;
      finalHighEl.innerText = highScore;
      overlay.classList.add('active');
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("galactic_high", highScore);
        highEl.innerText = highScore;
        finalHighEl.innerText = highScore;
        
        // Create celebration particles
        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            createParticle(
              Math.random() * gameWidth,
              Math.random() * game.clientHeight,
              '#4ecdc4'
            );
          }, i * 100);
        }
      }
    }

    restartBtn.addEventListener('click', startGame);
    
    // Initialize game
    startGame();
  </script>
</body>
</html>
